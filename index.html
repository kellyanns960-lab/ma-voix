<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6C63FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Voix">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ma Voix</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--purple:#6C63FF;--purple2:#A855F7;--bg:#F5F3FF;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,'Nunito','Helvetica Neue',sans-serif}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}

/* HEADER */
#header{background:linear-gradient(135deg,#6C63FF 0%,#A855F7 100%);padding:12px 14px 10px;flex-shrink:0;box-shadow:0 4px 20px rgba(108,99,255,.4)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.app-title{color:#fff;font-weight:900;font-size:17px;letter-spacing:.3px}
#btn-quick{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:20px;color:#fff;padding:6px 13px;font-size:12px;font-weight:800;cursor:pointer;transition:all .2s}
#btn-quick.active{background:rgba(255,255,255,.38)}

/* PHRASE DISPLAY */
#phrase-wrap{background:rgba(255,255,255,.18);border-radius:13px;padding:10px 12px;min-height:50px;display:flex;align-items:center;overflow-x:auto;gap:7px;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);margin-bottom:9px}
#phrase-wrap::-webkit-scrollbar{display:none}
.chip{background:rgba(255,255,255,.28);border-radius:9px;padding:4px 9px;color:#fff;font-weight:800;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:4px;flex-shrink:0}
.ph{color:rgba(255,255,255,.5);font-style:italic;font-size:13px;white-space:nowrap}

/* ACTIONS */
#actions{display:flex;gap:8px}
#btn-speak{flex:2;background:#fff;color:var(--purple);border:none;border-radius:11px;padding:11px;font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;box-shadow:0 3px 10px rgba(0,0,0,.15)}
#btn-speak:disabled{opacity:.45;cursor:default}
#btn-speak.speaking{background:#FFD700;color:#111;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
#btn-back,#btn-clear{flex:1;background:rgba(255,255,255,.22);color:#fff;border:1.5px solid rgba(255,255,255,.38);border-radius:11px;padding:11px;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s}
#btn-back:disabled,#btn-clear:disabled{opacity:.38;cursor:default}
#btn-clear{background:rgba(230,50,50,.32);border-color:rgba(255,100,100,.45)}

/* QUICK PHRASES */
#quick-panel{background:#1E1B4B;flex-shrink:0;overflow-y:auto;max-height:200px;padding:12px 14px;border-bottom:3px solid var(--purple);display:none}
.qp-label{color:rgba(255,255,255,.55);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:9px}
.qp-btn{width:100%;background:rgba(108,99,255,.25);border:1px solid rgba(108,99,255,.5);border-radius:11px;padding:11px 13px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:7px;transition:all .15s}
.qp-btn:last-child{margin-bottom:0}
.qp-btn:active{background:rgba(108,99,255,.5)}
.qp-em{font-size:20px;flex-shrink:0}

/* CATEGORY TABS */
#cat-tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #EDE9FF;scrollbar-width:none;flex-shrink:0;-webkit-overflow-scrolling:touch}
#cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex:0 0 auto;border:none;border-bottom:3px solid transparent;padding:9px 13px 6px;font-size:11px;font-weight:800;cursor:pointer;transition:all .2s;border-radius:8px 8px 0 0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;color:#999}
.cat-tab-em{font-size:17px}

/* SYMBOL GRID */
#grid-scroll{flex:1;overflow-y:auto;padding:11px 10px;-webkit-overflow-scrolling:touch}
#symbol-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.sym-btn{background:var(--cat-bg,#f5f3ff);border:2px solid var(--cat-color-a,#d0ccff);border-radius:16px;padding:14px 6px 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all .15s;min-height:95px;user-select:none}
.sym-btn:active,.sym-btn.pressed{background:var(--cat-color,#6C63FF);border-color:var(--cat-color,#6C63FF);transform:scale(.94);box-shadow:0 4px 14px rgba(108,99,255,.4)}
.sym-btn:active .sym-label,.sym-btn.pressed .sym-label{color:#fff}
.sym-em{font-size:32px;line-height:1}
.sym-label{font-size:12px;font-weight:800;color:#333;text-align:center;line-height:1.25}

/* RECENT BAR */
#recent-bar{background:#fff;border-top:1.5px solid #EDE9FF;padding:9px 12px;flex-shrink:0;display:none}
.rec-title{color:#aaa;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:7px}
.rec-chips{display:flex;gap:7px;flex-wrap:wrap}
.rec-chip{background:#F0EDFF;border:1.5px solid #D0CCFF;border-radius:10px;padding:5px 10px;color:var(--purple);font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.rec-chip:active{background:var(--purple);color:#fff}

/* LAST SPOKEN */
#last-bar{background:#fff;border-top:1.5px solid #EDE9FF;padding:8px 12px;display:none;align-items:center;gap:8px;flex-shrink:0}
.last-label{font-size:12px;color:#bbb;font-weight:700;white-space:nowrap}
.last-text{font-size:13px;color:var(--purple);font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btn-repeat{background:#F0EDFF;border:none;border-radius:8px;padding:5px 10px;color:var(--purple);font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
#btn-repeat:active{background:var(--purple);color:#fff}

/* URGENCE WARNING */
#urg-warn{background:#FFF0F0;border:2px solid #EF233C;border-radius:11px;padding:10px 13px;margin-bottom:10px;display:none;align-items:center;gap:8px}
.urg-text{color:#EF233C;font-weight:800;font-size:13px}
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="hdr-top">
      <span class="app-title">📢 Ma Voix</span>
      <button id="btn-quick">⚡ Phrases rapides</button>
    </div>
    <div id="phrase-wrap"><span class="ph">Appuie sur les pictogrammes…</span></div>
    <div id="actions">
      <button id="btn-speak" disabled>🔊 Parler</button>
      <button id="btn-back" disabled>⌫</button>
      <button id="btn-clear" disabled>🗑️</button>
    </div>
  </div>

  <div id="quick-panel">
    <div class="qp-label">Phrases rapides</div>
    <button class="qp-btn" data-text="J'ai besoin d'aide s'il te plaît"><span class="qp-em">🙏</span>J'ai besoin d'aide s'il te plaît</button>
    <button class="qp-btn" data-text="Je ne me sens pas bien"><span class="qp-em">😣</span>Je ne me sens pas bien</button>
    <button class="qp-btn" data-text="Peux-tu répéter s'il te plaît ?"><span class="qp-em">🔁</span>Peux-tu répéter s'il te plaît ?</button>
    <button class="qp-btn" data-text="Je suis fatigué, j'ai besoin de me reposer"><span class="qp-em">😴</span>Je suis fatigué, j'ai besoin de me reposer</button>
    <button class="qp-btn" data-text="Merci beaucoup"><span class="qp-em">🤍</span>Merci beaucoup</button>
    <button class="qp-btn" data-text="Je voudrais manger quelque chose"><span class="qp-em">🍽️</span>Je voudrais manger quelque chose</button>
    <button class="qp-btn" data-text="J'ai soif, je voudrais de l'eau"><span class="qp-em">💧</span>J'ai soif, je voudrais de l'eau</button>
    <button class="qp-btn" data-text="Appelle le 911, c'est une urgence"><span class="qp-em">🆘</span>Appelle le 911 – urgence</button>
  </div>

  <div id="cat-tabs"></div>

  <div id="grid-scroll">
    <div id="urg-warn"><span style="font-size:22px">⚠️</span><span class="urg-text">En cas d'urgence réelle : compose le 911</span></div>
    <div id="symbol-grid"></div>
  </div>

  <div id="recent-bar">
    <div class="rec-title">Récemment utilisés</div>
    <div class="rec-chips" id="rec-chips"></div>
  </div>

  <div id="last-bar">
    <span class="last-label">Dernier :</span>
    <span class="last-text" id="last-text"></span>
    <button id="btn-repeat">🔁 Répéter</button>
  </div>

</div>

<script>
const CATS = [
  {id:'social',label:'Social',color:'#FF6B9D',bg:'#FFF0F6',icon:'💬',syms:[
    {id:'s1',em:'👋',lb:'Bonjour'},{id:'s2',em:'🙋',lb:'Au revoir'},{id:'s3',em:'✅',lb:'Oui'},
    {id:'s4',em:'❌',lb:'Non'},{id:'s5',em:'🙏',lb:"S'il te plaît"},{id:'s6',em:'🤍',lb:'Merci'},
    {id:'s7',em:'😔',lb:'Pardon'},{id:'s8',em:'✋',lb:'Stop'},{id:'s9',em:'👍',lb:'Super'},
    {id:'s10',em:'⏳',lb:'Attends'},{id:'s11',em:'🔁',lb:'Répéter'},{id:'s12',em:'🚫',lb:'Non merci'},
  ]},
  {id:'besoins',label:'Besoins',color:'#4ECDC4',bg:'#F0FAFA',icon:'🌿',syms:[
    {id:'b1',em:'💧',lb:'Eau'},{id:'b2',em:'🍽️',lb:'Manger'},{id:'b3',em:'🚻',lb:'Toilette'},
    {id:'b4',em:'😴',lb:'Dormir'},{id:'b5',em:'🥶',lb:"J'ai froid"},{id:'b6',em:'🥵',lb:"J'ai chaud"},
    {id:'b7',em:'💊',lb:'Médicament'},{id:'b8',em:'🌤️',lb:'Sortir'},{id:'b9',em:'🏠',lb:'Rentrer'},
    {id:'b10',em:'📱',lb:'Téléphone'},{id:'b11',em:'🔋',lb:'Recharger'},{id:'b12',em:'🪑',lb:"M'asseoir"},
  ]},
  {id:'sentiments',label:'Sentiments',color:'#FFB347',bg:'#FFFBF0',icon:'🌟',syms:[
    {id:'f1',em:'😊',lb:'Heureux'},{id:'f2',em:'😢',lb:'Triste'},{id:'f3',em:'😣',lb:"J'ai mal"},
    {id:'f4',em:'😩',lb:'Fatigué'},{id:'f5',em:'😨',lb:"J'ai peur"},{id:'f6',em:'😰',lb:'Stressé'},
    {id:'f7',em:'😌',lb:'Calme'},{id:'f8',em:'😠',lb:'En colère'},{id:'f9',em:'🤩',lb:'Excité'},
    {id:'f10',em:'😑',lb:'Ennui'},{id:'f11',em:'🤢',lb:'Nauséeux'},{id:'f12',em:'❤️',lb:'Amour'},
  ]},
  {id:'activites',label:'Activités',color:'#845EC2',bg:'#F8F0FF',icon:'🎨',syms:[
    {id:'a1',em:'🎵',lb:'Musique'},{id:'a2',em:'📺',lb:'Télévision'},{id:'a3',em:'📖',lb:'Lire'},
    {id:'a4',em:'🎮',lb:'Jouer'},{id:'a5',em:'✏️',lb:'Dessiner'},{id:'a6',em:'🎬',lb:'Film'},
    {id:'a7',em:'🌐',lb:'Internet'},{id:'a8',em:'📞',lb:'Appel vidéo'},{id:'a9',em:'🛋️',lb:'Me reposer'},
    {id:'a10',em:'🛁',lb:'Bain'},{id:'a11',em:'📷',lb:'Photo'},{id:'a12',em:'🎭',lb:'Théâtre'},
  ]},
  {id:'questions',label:'Questions',color:'#06D6A0',bg:'#F0FFF8',icon:'❓',syms:[
    {id:'q1',em:'🤔',lb:'Quoi ?'},{id:'q2',em:'📍',lb:'Où ?'},{id:'q3',em:'👤',lb:'Qui ?'},
    {id:'q4',em:'🕐',lb:'Quand ?'},{id:'q5',em:'💭',lb:'Pourquoi ?'},{id:'q6',em:'⚙️',lb:'Comment ?'},
    {id:'q7',em:'🔢',lb:'Combien ?'},{id:'q8',em:'⏰',lb:'Quelle heure ?'},{id:'q9',em:'🚀',lb:'Prêt ?'},
    {id:'q10',em:'🆗',lb:'Ça va ?'},{id:'q11',em:'📏',lb:'Encore loin ?'},{id:'q12',em:'🏁',lb:"C'est fini ?"},
  ]},
  {id:'urgence',label:'Urgence',color:'#EF233C',bg:'#FFF0F0',icon:'🚨',syms:[
    {id:'u1',em:'🆘',lb:'Appeler 911'},{id:'u2',em:'⚡',lb:'Vite !'},{id:'u3',em:'👨‍⚕️',lb:'Médecin'},
    {id:'u4',em:'🚑',lb:'Ambulance'},{id:'u5',em:'⚠️',lb:'Je suis tombé'},{id:'u6',em:'🗺️',lb:'Je suis perdu'},
    {id:'u7',em:'🚧',lb:'Je suis bloqué'},{id:'u8',em:'😟',lb:'Je suis seul'},
  ]},
];

let phrase = [], activeCat = 'social', recents = [], lastSpoken = '';

const $ = id => document.getElementById(id);
const phraseWrap = $('phrase-wrap');
const grid = $('symbol-grid');
const recChips = $('rec-chips');
const lastText = $('last-text');
const speakBtn = $('btn-speak');
const backBtn = $('btn-back');
const clearBtn = $('btn-clear');
const lastBar = $('last-bar');
const recBar = $('recent-bar');
const urgWarn = $('urg-warn');
const quickPanel = $('quick-panel');
const quickBtn = $('btn-quick');

function speak(text) {
  if (!window.speechSynthesis) { alert('Synthèse vocale non disponible'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR'; u.rate = 0.88; u.pitch = 1.0;
  speechSynthesis.speak(u);
}

function renderPhrase() {
  if (!phrase.length) {
    phraseWrap.innerHTML = '<span class="ph">Appuie sur les pictogrammes…</span>';
  } else {
    phraseWrap.innerHTML = phrase.map(s => `<span class="chip">${s.em} ${s.lb}</span>`).join('');
    phraseWrap.scrollLeft = phraseWrap.scrollWidth;
  }
}

function renderBtns() {
  const has = !!phrase.length;
  speakBtn.disabled = !has;
  backBtn.disabled = !has;
  clearBtn.disabled = !has;
}

function renderCatTabs() {
  const tabs = document.querySelectorAll('.cat-tab');
  tabs.forEach(tab => {
    const cat = CATS.find(c => c.id === tab.dataset.id);
    const active = tab.dataset.id === activeCat;
    tab.style.color = active ? cat.color : '#999';
    tab.style.background = active ? cat.bg : 'transparent';
    tab.style.borderBottom = active ? `3px solid ${cat.color}` : '3px solid transparent';
  });
}

function renderGrid() {
  const cat = CATS.find(c => c.id === activeCat);
  urgWarn.style.display = activeCat === 'urgence' ? 'flex' : 'none';
  grid.innerHTML = cat.syms.map(s =>
    `<button class="sym-btn" data-id="${s.id}"
      style="--cat-color:${cat.color};--cat-bg:${cat.bg};--cat-color-a:${cat.color}55">
      <span class="sym-em">${s.em}</span>
      <span class="sym-label">${s.lb}</span>
    </button>`
  ).join('');
  grid.querySelectorAll('.sym-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sym = cat.syms.find(s => s.id === btn.dataset.id);
      if (!sym) return;
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 200);
      phrase.push(sym);
      recents = [sym, ...recents.filter(r => r.id !== sym.id)].slice(0, 8);
      renderPhrase(); renderBtns(); renderRecents();
    });
  });
}

function renderRecents() {
  if (!recents.length) { recBar.style.display = 'none'; return; }
  recBar.style.display = 'block';
  recChips.innerHTML = recents.map((s, i) =>
    `<button class="rec-chip" data-i="${i}">${s.em} ${s.lb}</button>`
  ).join('');
  recChips.querySelectorAll('.rec-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const sym = recents[+btn.dataset.i];
      if (!sym) return;
      phrase.push(sym);
      renderPhrase(); renderBtns();
    });
  });
}

// Build tabs
const tabsEl = $('cat-tabs');
CATS.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-tab';
  btn.dataset.id = cat.id;
  btn.innerHTML = `<span class="cat-tab-em">${cat.icon}</span>${cat.label}`;
  btn.addEventListener('click', () => { activeCat = cat.id; renderCatTabs(); renderGrid(); });
  tabsEl.appendChild(btn);
});

// Action buttons
speakBtn.addEventListener('click', () => {
  const text = phrase.map(s => s.lb).join(', ');
  if (!text) return;
  lastSpoken = text;
  speak(text);
  lastText.textContent = `"${text}"`;
  lastBar.style.display = 'flex';
  speakBtn.textContent = '🔊 En cours…';
  speakBtn.classList.add('speaking');
  setTimeout(() => { speakBtn.textContent = '🔊 Parler'; speakBtn.classList.remove('speaking'); }, 2200);
});

backBtn.addEventListener('click', () => { phrase.pop(); renderPhrase(); renderBtns(); });
clearBtn.addEventListener('click', () => { phrase = []; renderPhrase(); renderBtns(); });

$('btn-repeat').addEventListener('click', () => { if (lastSpoken) speak(lastSpoken); });

quickBtn.addEventListener('click', () => {
  const open = quickPanel.style.display === 'block';
  quickPanel.style.display = open ? 'none' : 'block';
  quickBtn.classList.toggle('active', !open);
});

document.querySelectorAll('.qp-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const text = btn.dataset.text;
    lastSpoken = text;
    speak(text);
    lastText.textContent = `"${text}"`;
    lastBar.style.display = 'flex';
    quickPanel.style.display = 'none';
    quickBtn.classList.remove('active');
  });
});

// Init
renderPhrase(); renderBtns(); renderCatTabs(); renderGrid();

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
